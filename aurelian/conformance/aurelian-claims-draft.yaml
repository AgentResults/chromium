# CF-1 deliverable (AURELIAN-CONFORMANT-FEDERATION-DESIGN.md §3.3a-D4a,
# TDD plan CF-1/CF-V): the machine-readable form of design §3.3b — claimed ∪
# queued ∪ not-claimed ∪ out-of-scope rows, the per-row disposition
# exclusions, and the CLOSED no-row prefix list, carried as DATA. This file
# is the CF-V classifier's Input B (the banked __handshake capture is Input
# A; A ⊆ B's claimed rows is asserted), and it becomes the embodiments.yaml
# aurelian column at CF-10's flip. Kept in LOCKSTEP with facet_claims.{h,cc}
# (the compiled projection of the claimed rows).
#
# Census snapshot (re-verified 2026-06-11 against Legion e619076303 corpus):
# 692 sub-facet entries, 385 distinct facets. Statuses are written for the
# moment CF-10 lands; the §3.3 closure rule executes at CF-V (red claimed →
# queued downgrade or core-DEFECT block; green CF-V-mandatory queued → flip).
#
# R6-F1 RESOLUTION (recorded, the foldable review residual): the kg/
# subscription named pass runs ALL FOUR single-peer vectors —
# subscription-cursor-replay INCLUDED, expected red (no cursor surface),
# exactly the kg/persistence expected-red treatment. Step-3 counts become
# 7 queued probes / 8 executions; CF-V wall-clock 70 (62 Step-2 + 8
# Step-3). Ground: uniform
# mechanism (every queued single-peer vector runs and banks its outcome),
# no assertion-by-proxy.

# The lane pin (classifier-checked DATA): the expected impl-driving
# selection under the amended §3.3a-D5 binding. A vector changing category
# (or a corpus move) shifts the count -> the classifier exits non-zero.
